<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Assistant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #00ffff;
            overflow-x: hidden;
            height: 100vh;
            position: relative;
        }
        
        /* Animated Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, #00ffff22 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, #0080ff22 0%, transparent 50%),
                linear-gradient(45deg, transparent 40%, #00ffff11 50%, transparent 60%);
            animation: backgroundPulse 4s ease-in-out infinite alternate;
            z-index: -1;
        }
        
        @keyframes backgroundPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* Grid Pattern */
        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: -1;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        /* Main Container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* JARVIS Logo */
        .jarvis-logo {
            font-size: 4rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00ffff, #0080ff, #00ffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 3s ease-in-out infinite alternate;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        
        @keyframes logoGlow {
            0% { 
                background-position: 0% 50%;
                filter: brightness(1);
            }
            100% { 
                background-position: 100% 50%;
                filter: brightness(1.2);
            }
        }
        
        /* Central AI Avatar */
        .ai-avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #00ffff33, #0080ff22, transparent);
            border: 3px solid #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            position: relative;
            animation: avatarPulse 2s ease-in-out infinite alternate;
            box-shadow: 
                0 0 50px rgba(0, 255, 255, 0.5),
                inset 0 0 50px rgba(0, 255, 255, 0.2);
        }
        
        @keyframes avatarPulse {
            0% { 
                transform: scale(1);
                box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            }
            100% { 
                transform: scale(1.05);
                box-shadow: 0 0 80px rgba(0, 255, 255, 0.8);
            }
        }
        
        .ai-avatar::before {
            content: '🤖';
            font-size: 80px;
            animation: robotFloat 3s ease-in-out infinite;
        }
        
        @keyframes robotFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        /* Orbiting Elements */
        .orbit {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: orbit 10s linear infinite;
        }
        
        .orbit-item {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #00ffff;
            border-radius: 50%;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #00ffff;
        }
        
        @keyframes orbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Control Panel */
        .control-panel {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.3),
                inset 0 0 30px rgba(0, 255, 255, 0.1);
            min-width: 400px;
        }
        
        /* Input Styles */
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #00ffff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .input-field {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffff;
            border-radius: 10px;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #0080ff;
            box-shadow: 0 0 20px rgba(0, 128, 255, 0.5);
        }
        
        /* Button Styles */
        .btn {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border: none;
            border-radius: 10px;
            color: #000;
            padding: 15px 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.listening {
            background: linear-gradient(45deg, #ff4444, #ff6666);
            animation: pulse 1s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        /* Response Display */
        .response-area {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            position: relative;
        }
        
        .response-text {
            color: #00ffff;
            line-height: 1.6;
            font-size: 14px;
        }
        
        /* Loading Animation */
        .loading {
            display: none;
            text-align: center;
            color: #00ffff;
        }
        
        .loading-dots {
            display: inline-block;
            animation: loadingDots 1.5s ease-in-out infinite;
        }
        
        @keyframes loadingDots {
            0%, 20% { opacity: 0.2; }
            50% { opacity: 1; }
            80%, 100% { opacity: 0.2; }
        }
        
        /* Status Indicators */
        .status-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 20px;
            margin: 5px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            animation: statusBlink 2s ease-in-out infinite;
        }
        
        .status-dot.online {
            background: #00ff00;
        }
        
        .status-dot.offline {
            background: #ff4444;
        }
        
        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) translateX(0px);
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
            50% {
                transform: translateY(0vh) translateX(100px);
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .jarvis-logo {
                font-size: 2.5rem;
            }
            
            .ai-avatar {
                width: 150px;
                height: 150px;
            }
            
            .ai-avatar::before {
                font-size: 60px;
            }
            
            .control-panel {
                min-width: 300px;
                padding: 20px;
            }
            
            .orbit {
                width: 200px;
                height: 200px;
            }
        }
        
        /* Audio Visualization */
        .audio-visualizer {
            display: flex;
            justify-content: center;
            align-items: end;
            height: 50px;
            margin: 20px 0;
            gap: 3px;
        }
        
        .audio-bar {
            width: 4px;
            background: linear-gradient(to top, #00ffff, #0080ff);
            border-radius: 2px;
            animation: audioWave 1s ease-in-out infinite alternate;
        }
        
        .audio-bar:nth-child(2n) {
            animation-delay: 0.1s;
        }
        
        .audio-bar:nth-child(3n) {
            animation-delay: 0.2s;
        }
        
        @keyframes audioWave {
            0% { height: 5px; }
            100% { height: 40px; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="grid-pattern"></div>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <h1 class="jarvis-logo">JARVIS</h1>
        
        <div class="ai-avatar">
            <div class="orbit">
                <div class="orbit-item"></div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot online" id="aiStatus"></div>
                AI System
            </div>
            <div class="status-item">
                <div class="status-dot online" id="voiceStatus"></div>
                Voice Recognition
            </div>
            <div class="status-item">
                <div class="status-dot online" id="geminiStatus"></div>
                Gemini Connected
            </div>
        </div>
        
        <div class="control-panel">
            <div class="input-group">
                <label for="userInput">COMMAND INPUT</label>
                <input type="text" id="userInput" class="input-field" placeholder="Enter your command..." onkeypress="handleKeyPress(event)">
            </div>
            
            <div style="text-align: center;">
                <button class="btn" onclick="sendMessage()">EXECUTE</button>
                <button class="btn" id="voiceBtn" onclick="toggleVoiceRecognition()">🎤 VOICE</button>
                <button class="btn" onclick="clearChat()">CLEAR</button>
            </div>
            
            <div class="audio-visualizer" id="audioVisualizer" style="display: none;">
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
                <div class="audio-bar"></div>
            </div>
            
            <div class="loading" id="loading">
                <span class="loading-dots">● ● ●</span> JARVIS IS THINKING...
            </div>
            
            <div class="response-area">
                <div class="response-text" id="responseText">
                    <strong>JARVIS:</strong> Hello! I am JARVIS, your AI assistant. I'm powered by Google Gemini and ready to help you with any task. You can type your commands or use voice input. How may I assist you today?
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const GEMINI_API_KEY = 'AIzaSyC530XI-wF0wc_77w4Z4qGRTBRxZx1HYNI';
        const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent';
        
        // Global variables
        let isListening = false;
        let recognition = null;
        let speechSynthesis = window.speechSynthesis;
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            initializeParticles();
            initializeVoiceRecognition();
            updateSystemStatus();
        });
        
        // Create floating particles
        function initializeParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Initialize voice recognition
        function initializeVoiceRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';
                
                recognition.onstart = function() {
                    isListening = true;
                    document.getElementById('voiceBtn').classList.add('listening');
                    document.getElementById('voiceBtn').textContent = '🎤 LISTENING...';
                    document.getElementById('audioVisualizer').style.display = 'flex';
                };
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('userInput').value = transcript;
                    sendMessage();
                };
                
                recognition.onend = function() {
                    isListening = false;
                    document.getElementById('voiceBtn').classList.remove('listening');
                    document.getElementById('voiceBtn').textContent = '🎤 VOICE';
                    document.getElementById('audioVisualizer').style.display = 'none';
                };
                
                recognition.onerror = function(event) {
                    console.error('Speech recognition error:', event.error);
                    isListening = false;
                    document.getElementById('voiceBtn').classList.remove('listening');
                    document.getElementById('voiceBtn').textContent = '🎤 VOICE';
                    document.getElementById('audioVisualizer').style.display = 'none';
                };
            } else {
                document.getElementById('voiceStatus').className = 'status-dot offline';
            }
        }
        
        // Toggle voice recognition
        function toggleVoiceRecognition() {
            if (!recognition) {
                alert('Voice recognition is not supported in your browser.');
                return;
            }
            
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }
        
        // Handle Enter key press
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Send message to Gemini AI
        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (!message) return;
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            
            // Add user message to chat
            appendMessage('USER', message);
            
            // Clear input
            userInput.value = '';
            
            try {
                const response = await fetch(GEMINI_API_URL + '?key=' + GEMINI_API_KEY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are JARVIS, Tony Stark's AI assistant. You are sophisticated, helpful, and have a slightly witty personality. Respond to this message: ${message}`
                            }]
                        }]
                    })
                });
                
                const data = await response.json();
                
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    appendMessage('JARVIS', aiResponse);
                    speakResponse(aiResponse);
                } else {
                    throw new Error('Invalid response from Gemini API');
                }
                
            } catch (error) {
                console.error('Error:', error);
                appendMessage('JARVIS', 'I apologize, but I encountered an error while processing your request. Please try again.');
            }
            
            // Hide loading
            document.getElementById('loading').style.display = 'none';
        }
        
        // Append message to chat
        function appendMessage(sender, message) {
            const responseText = document.getElementById('responseText');
            const messageElement = document.createElement('div');
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            messageElement.style.marginBottom = '15px';
            messageElement.style.padding = '10px';
            messageElement.style.background = sender === 'USER' ? 'rgba(0, 128, 255, 0.1)' : 'rgba(0, 255, 255, 0.1)';
            messageElement.style.borderRadius = '10px';
            messageElement.style.border = `1px solid ${sender === 'USER' ? '#0080ff' : '#00ffff'}`;
            
            responseText.appendChild(messageElement);
            responseText.scrollTop = responseText.scrollHeight;
        }
        
        // Speak response using Text-to-Speech
        function speakResponse(text) {
            if (speechSynthesis) {
                // Cancel any ongoing speech
                speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1;
                utterance.pitch = 1;
                utterance.volume = 1;
                
                // Try to find a suitable voice
                const voices = speechSynthesis.getVoices();
                const preferredVoice = voices.find(voice => 
                    voice.name.includes('Google') || 
                    voice.name.includes('Chrome') ||
                    voice.lang.startsWith('en')
                );
                
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }
                
                speechSynthesis.speak(utterance);
            }
        }
        
        // Clear chat
        function clearChat() {
            document.getElementById('responseText').innerHTML = '<strong>JARVIS:</strong> Hello! I am JARVIS, your AI assistant. I\'m powered by Google Gemini and ready to help you with any task. You can type your commands or use voice input. How may I assist you today?';
        }
        
        // Update system status
        function updateSystemStatus() {
            // Test Gemini API connection
            fetch(GEMINI_API_URL + '?key=' + GEMINI_API_KEY, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: 'Hello'
                        }]
                    }]
                })
            }).then(response => {
                if (response.ok) {
                    document.getElementById('geminiStatus').className = 'status-dot online';
                } else {
                    document.getElementById('geminiStatus').className = 'status-dot offline';
                }
            }).catch(() => {
                document.getElementById('geminiStatus').className = 'status-dot offline';
            });
        }
        
        // Add some interactivity
        document.addEventListener('mousemove', function(e) {
            const avatar = document.querySelector('.ai-avatar');
            const rect = avatar.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const deltaX = (e.clientX - centerX) * 0.01;
            const deltaY = (e.clientY - centerY) * 0.01;
            
            avatar.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.02)`;
        });
        
        // Reset avatar position when mouse leaves
        document.addEventListener('mouseleave', function() {
            const avatar = document.querySelector('.ai-avatar');
            avatar.style.transform = 'translate(0px, 0px) scale(1)';
        });
        
        // Add typing effect for initial message
        function typeWriter(element, text, speed = 50) {
            let i = 0;
            element.innerHTML = '';
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                }
            }
            typing();
        }
        
        // Initialize typing effect on load
        window.addEventListener('load', function() {
            const initialMessage = document.getElementById('responseText');
            const text = initialMessage.textContent;
            typeWriter(initialMessage, text, 30);
        });
    </script>
</body>
</html>
